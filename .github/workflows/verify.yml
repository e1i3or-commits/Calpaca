name: verify

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: typecheck, lint, tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    # The suite skips its database-backed tests when TEST_DATABASE_URL is
    # absent, which would let a broken migration or query pass CI in silence.
    # Postgres is the only infrastructure Calpaca needs, so CI runs a real one.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U test -d test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://test:test@127.0.0.1:5432/test
      DATABASE_URL: postgres://test:test@127.0.0.1:5432/test

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: "1.3"

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Verify (typecheck, lint, tests)
        run: bun run verify

      - name: Confirm the database-backed tests actually ran
        # A green run that skipped every database test is a false pass. Anything
        # above zero skips here means the suite silently lost its database.
        run: |
          skipped=$(bun test 2>&1 | grep -oE '^ *[0-9]+ skip' | grep -oE '[0-9]+' || echo 0)
          echo "skipped: ${skipped:-0}"
          if [ "${skipped:-0}" -ne 0 ]; then
            echo "::error::${skipped} tests skipped — TEST_DATABASE_URL is not reaching the suite"
            exit 1
          fi

      - name: Confirm the checked-in OpenAPI document is current
        run: |
          bun run openapi:generate
          git diff --exit-code docs/openapi.json \
            || { echo "::error::docs/openapi.json is stale — run bun run openapi:generate"; exit 1; }

      - name: Confirm the web bundle builds
        run: bun run build:web
