# Production stack on the Hetzner box. Postgres is the only infrastructure
# dependency (hard budget rule); NPM reaches the app by container name over
# a shared external proxy network, so no host ports are published.
#
# Run from the repo root:
#   docker compose -f deploy/compose.yml --env-file .env up -d --build
#
# Keeping the env file OUT of the repo root is strongly preferred: `bun` auto-
# loads ./.env, so a .env sitting next to package.json silently leaks production
# values into `bun run verify` and fails ~56 otherwise-passing tests (prod's
# CALPACA_DEPLOYMENT_MODE=hosted flips hosted-only branches). Point
# SCHEDULER_ENV_FILE at an absolute path outside the repo and pass the same path
# to --env-file so compose interpolation resolves it:
#   docker compose -f deploy/compose.yml --env-file /opt/scheduler-env/.env up -d --build
# with SCHEDULER_ENV_FILE=/opt/scheduler-env/.env set inside that file.
#
# The env file (chmod 600, mirrored from Infisical /tier5/scheduler) must define:
#   SCHEDULER_DB_PASSWORD, DATABASE_URL, BETTER_AUTH_SECRET, BETTER_AUTH_URL,
#   PUBLIC_URL, GOOGLE_CLIENT_ID, GOOGLE_CLIENT_SECRET, SMTP_URL, EMAIL_FROM,
#   EMAIL_DELIVERY_WEBHOOK_SECRET. Hosted custom-domain automation additionally
#   uses NPM_API_URL, NPM_ADMIN_EMAIL, NPM_ADMIN_PASSWORD,
#   NPM_LETSENCRYPT_EMAIL, CUSTOM_DOMAIN_FORWARD_HOST, and
#   CUSTOM_DOMAIN_FORWARD_PORT.
name: scheduler

services:
  app:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: ts-scheduler-app
    restart: unless-stopped
    env_file: ${SCHEDULER_ENV_FILE:-../.env}
    depends_on:
      db:
        condition: service_healthy
    networks:
      - default
      - proxy-net

  db:
    image: postgres:16
    container_name: ts-scheduler-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: scheduler
      POSTGRES_PASSWORD: ${SCHEDULER_DB_PASSWORD}
      POSTGRES_DB: scheduler
    volumes:
      - scheduler-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U scheduler -d scheduler"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  scheduler-db-data:

networks:
  proxy-net:
    external: true
    name: ${SCHEDULER_PROXY_NETWORK:-scheduler-proxy}
